summary: anew ships a first-party hosted remote MCP server that answers tools/list anonymously over plain
  HTTP. No OAuth challenge, no session handshake, no client library — a single POST returns the real tool
  set with full inputSchema and outputSchema. It is the provider's primary agent interface, and the REST
  API is the fallback rather than the other way round.
