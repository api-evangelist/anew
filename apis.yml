name: anew
description: A stateless "page-in-a-URL" service that encodes a self-contained HTML document into a shareable, immutable
  URL (HTML → URL) and reads it back (URL → HTML). No account, no hosting; free, deterministic, and unauthenticated. Exposes
  a REST/HTTP API, a hosted MCP server, an A2A agent, and llms.txt.
