method: searched
source: registry.npmjs.org, pypi.org, https://github.com/round/anew.page, https://anew.page/llms.txt
summary: >-
  anew publishes NO client SDKs in any package registry, and says so plainly rather than leaving it to be
  discovered. What it distributes instead is a set of first-party agent-client manifests from one GitHub
  repository — a Claude Code plugin, a Cursor plugin, a Gemini CLI extension, an Agent Plugins manifest,
  an MCP registry entry and an Agent Skill — every one of which binds the same hosted endpoint rather
  than shipping code. The repository states it "contains no product source".
sdk_count: 0
official_sdk_count: 0
registry_package_count: 0
distribution_model: manifest-only
notes:
  - >-
    There is no npm, PyPI, Maven, NuGet, Go, RubyGems, Packagist or crates.io package. This is a
    deliberate position for an API whose entire client is one curl: POST raw HTML to /write and read the
    URL from the response body.
  - >-
    The npm package named `anew` is NOT this provider — it is an unrelated React/Redux framework
    (github.com/abubakir1997/anew, latest 2.8.14, last modified 2022-06-13). Recorded explicitly so a
    later pass does not adopt it.
  - >-
    Because the artifacts below are served from a git repository rather than a registry, there is no
    metadata endpoint that dates a release, and the repository has no releases and no tags. The version
    each manifest declares internally is recorded; `published` is null with a note, meaning checked and
    nothing datable to record.
  - >-
    The repository's last push (2026-09-01) is the only available recency signal, and it is recent
    relative to the API, so there is no abandonment signal here.
