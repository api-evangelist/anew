  api-catalog linkset, an A2A agent card, two MCP discovery documents, an Agent Skills discovery index,
  an AI-resource-discovery catalog, and an RFC 9421 HTTP Message Signatures key directory. It serves no
  security.txt and no OAuth/OIDC metadata — the latter correctly, since there is no authentication.
