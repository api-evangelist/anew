summary: >-
  No trust center, no certifications, and no compliance program. What anew publishes instead is a
  structural privacy argument: there is no account, no cookie and no profile, a page travels inside its
  own URL rather than being stored, and nothing is retained — so there is, as the policy puts it,
  "nothing you would ever need to access or delete".
