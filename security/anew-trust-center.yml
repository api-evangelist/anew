data_retention:
  model: none
  detail: >-
    No source HTML and no page record are kept — the URL carries the page. The single exception the
    provider documents is a best-effort screenshot render cached publicly at the page's .png twin.
  caveat: >-
    A consequence worth stating plainly for buyers: because the page rides in the URL, anyone with the
    URL can decode it. The provider says so directly — anew is explicitly not for content that must stay
    private.
abuse_controls:
  - control: threat-feed link blocking
    detail: >-
      A page whose outbound links reach a host currently flagged by Cloudflare's or Google's threat feeds
      is refused with 451 content_blocked before it renders.
  - control: rate limiting
    detail: 300 requests per 60 seconds per client IP across /write, /mcp and /a2a/v1.
  - control: script handling
    detail: >-
      The MCP tool contract rejects script elements and inline event handlers inside `html`, requiring
      JavaScript to be passed separately so the server controls where it is inserted.
